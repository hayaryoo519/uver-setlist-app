# Forced trigger update for mobile scroll fix
name: Deploy to Staging

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to Staging Server
        run: |
          cd ~/apps/uver-setlist-staging
          git fetch origin dev
          git checkout dev
          git reset --hard origin/dev

          # イメージをビルド
          docker compose build

          # DBマイグレーション（db-staging の healthcheck 完了後に実行）
          docker compose run --rm app-staging node server/scripts/migrate.js

          # サービス起動
          docker compose up -d

          # APIヘルスチェック
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:9001/api/ping; then
              echo "API health check passed."
              exit 0
            fi
            echo "Waiting for API startup... (${attempt}/10)"
            sleep 2
          done

          echo "API health check failed."
          exit 1
