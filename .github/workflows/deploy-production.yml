name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to Production Server
        run: |
          cd ~/apps/uver-setlist-app/server

          # 1. 現在の.envをバックアップ（サーバー固有の設定を守るため）
          cp .env .env.backup

          # 2. 最新コードを強制的に取得
          git fetch origin main
          git reset --hard origin/main

          # 3. バックアップから.envを復元
          cp .env.backup .env

          # 4. バックエンド依存関係のインストール
          npm ci

          # 5. DBバックアップ
          cd ~/apps/uver-setlist-app
          BACKUP_DIR="$HOME/apps/uver-setlist-app/backups" ./scripts/backup-db.sh

          # 6. DBマイグレーション
          cd ~/apps/uver-setlist-app/server
          node scripts/migrate.js

          # 7. フロントエンドビルド
          cd ~/apps/uver-setlist-app
          npm ci --legacy-peer-deps
          npm run build

          # 8. サービス再起動
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart uver-setlist

          # 9. APIヘルスチェック
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/ping; then
              echo "API health check passed."
              exit 0
            fi
            echo "Waiting for API startup... (${attempt}/10)"
            sleep 2
          done

          echo "API health check failed."
          exit 1
