name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to Production Server
        run: |
          cd ~/apps/uver-setlist-app/server

          # 1. 現在の.envをバックアップ（サーバー固有の設定を守るため）
          cp .env .env.backup

          # 2. 最新コードを強制的に取得
          git fetch origin main
          git reset --hard origin/main

          # 3. バックアップから.envを復元
          cp .env.backup .env

          # 4. バックエンド依存関係のインストール
          npm ci

          # 5. DBバックアップ
          cd ~/apps/uver-setlist-app
          BACKUP_DIR="$HOME/apps/uver-setlist-app/backups" ./scripts/backup-db.sh

          # 6. DBマイグレーション
          cd ~/apps/uver-setlist-app/server
          DB_ROLE=$(node -e "require('dotenv').config({ path: '.env', quiet: true }); const { Pool } = require('pg'); const pool = new Pool({ user: process.env.DB_USER, password: process.env.DB_PASSWORD, host: process.env.DB_HOST, port: process.env.DB_PORT, database: process.env.DB_NAME }); pool.query('SELECT current_user').then(({ rows }) => { console.log(rows[0].current_user); return pool.end(); }).catch(err => { console.error(err.message); process.exit(1); });")
          DB_NAME=$(node -e "require('dotenv').config({ path: '.env', quiet: true }); console.log(process.env.DB_NAME || '')")
          if [[ ! "$DB_ROLE" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || [[ ! "$DB_NAME" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "Invalid database role or database name"
            exit 1
          fi

          revoke_schema_create() {
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -u postgres \
              psql --dbname="$DB_NAME" --set=app_role="$DB_ROLE" \
              --command='REVOKE CREATE ON SCHEMA public FROM :"app_role";'
          }
          trap revoke_schema_create EXIT
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -u postgres \
            psql --dbname="$DB_NAME" --set=app_role="$DB_ROLE" \
            --command='GRANT CREATE ON SCHEMA public TO :"app_role";'
          node scripts/migrate.js
          revoke_schema_create
          trap - EXIT

          # 7. フロントエンドビルド
          cd ~/apps/uver-setlist-app
          npm ci --legacy-peer-deps
          npm run build

          # 8. サービス再起動
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart uver-setlist

          # 9. APIヘルスチェック
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/ping; then
              echo "API health check passed."
              exit 0
            fi
            echo "Waiting for API startup... (${attempt}/10)"
            sleep 2
          done

          echo "API health check failed."
          exit 1
