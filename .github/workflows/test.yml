name: Run Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    # #244分離中の#242仮baseでも同じ隔離CIを実行。devへ戻す際に整理する。
    branches: [ main, dev, hayaryoo519/fix-issue196-sync-guards ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: cd server && npm ci
      - name: Run backend tests
        run: cd server && npm test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run frontend tests
        run: npm test -- --run
      - name: Read-only country preview fixture tests
        run: node --test scripts/audit/preview-live-country.test.mjs

  test-live-metadata-integration:
    # Stagingのpostgres:16系に合わせる。既存サービス/DBには接続しない。
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      APP_ENV: test
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install frontend and backend dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix server
      - name: Install local PostgreSQL 16 tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends postgresql-16
          test -x "$PG_BIN/initdb"
          test -x "$PG_BIN/pg_ctl"
          test -x "$PG_BIN/psql"
          "$PG_BIN/initdb" --version
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Type check and synthetic API browser tests
        run: |
          npx tsc --noEmit
          npm run test:e2e:metadata
      - name: Disposable legacy-schema compatibility
        run: npm run test:metadata-db --prefix server
      - name: Disposable real auth, native Worker and production Workbox tests
        run: npm run test:metadata-db --prefix server -- --worker --built-worker
      # 実JWT/ストレージを扱う結合試験のtrace/ログ/temp DBはuploadしない。
      - name: Upload synthetic API browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-metadata-synthetic-browser-report
          path: |
            playwright-report/metadata/
            test-results/metadata/
          if-no-files-found: ignore
          retention-days: 3
